<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
  <h2>麦克风录音测试</h2>
  <button id="rec" style="padding:15px 30px; font-size:18px; background:red; color:white; border:none; border-radius:8px;">开始录音</button>
  <p id="status">等待操作...</p>
  <audio id="player" controls style="margin-top:20px; width:80%; display:none;"></audio>
  
  <script>
    let mediaRecorder;
    let chunks = [];
    const recBtn = document.getElementById('rec');
    const status = document.getElementById('status');
    const player = document.getElementById('player');

    recBtn.onclick = async () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }
      try {
        status.innerText = "正在请求麦克风权限...";
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        status.innerText = "正在录音中... 请说话";
        recBtn.innerText = "停止录音";
        recBtn.style.background = "gray";
        
        mediaRecorder = new MediaRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        
        mediaRecorder.onstop = () => {
          status.innerText = "录音结束，请点击播放";
          recBtn.innerText = "重新录音";
          recBtn.style.background = "red";
          const blob = new Blob(chunks, { type: 'audio/webm' });
          player.src = URL.createObjectURL(blob);
          player.style.display = "block";
          stream.getTracks().forEach(track => track.stop());
        };
        mediaRecorder.start();
      } catch (err) {
        status.innerText = "录音失败！错误：" + err.message;
        alert("无法访问麦克风：" + err.message);
      }
    };
  </script>
</body>
</html>
