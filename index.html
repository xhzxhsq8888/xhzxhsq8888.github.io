
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三年级英语 · 对话跟读检测</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#eef2f7;color:#1f2937;min-height:100vh;
    padding:14px 12px 48px;
  }
  .app{max-width:760px;margin:0 auto;}

  #errorBar{
    display:none;max-width:760px;margin:0 auto 10px;
    background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;
    border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;
    white-space:pre-wrap;word-break:break-all;
  }
  #toast{
    position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);
    background:rgba(30,41,59,.95);color:#fff;font-size:14px;
    padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;
    transition:.25s;z-index:9999;max-width:88vw;text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.warn{background:rgba(194,65,12,.96);}

  .hero{
    text-align:center;padding:18px 12px 20px;border-radius:16px;color:#fff;
    background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#3b82f6);
    box-shadow:0 10px 26px rgba(37,99,235,.28);
    margin-bottom:14px;
  }
  .hero h1{margin:0 0 6px;font-size:20px;letter-spacing:2px;}
  .hero p{margin:0;font-size:12px;color:#bfdbfe;letter-spacing:1px;}

  .card{
    background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;
    box-shadow:0 6px 20px rgba(15,23,42,.07);
  }
  .card-title{
    font-size:15px;margin:0 0 14px;color:#1e3a8a;font-weight:800;
    display:flex;align-items:center;gap:8px;
  }
  .card-title::before{
    content:"";width:4px;height:16px;border-radius:2px;
    background:linear-gradient(#2563eb,#60a5fa);
  }

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:#475569;margin-bottom:6px;font-weight:600;}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:10px;
    font-size:15px;outline:none;font-family:inherit;background:#f8fafc;
  }
  .field input:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .field input.err{border-color:#ef4444;background:#fef2f2;}

  .hint{
    margin:14px 0 0;font-size:12.5px;color:#64748b;line-height:1.85;
    background:#f8fafc;border-radius:10px;padding:10px 12px;
    border-left:3px solid #93c5fd;
  }

  .btn{
    border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.16s;
  }
  .btn:active{transform:scale(.985);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3);}
  .btn.ghost{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;}
  .btn.danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
  .btn.success{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;}
  .btn.record{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;box-shadow:0 4px 14px rgba(220,38,38,.35);}
  .btn.record.recording{animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5);}50%{box-shadow:0 0 0 12px rgba(220,38,38,0);}}
  #btnStart{width:100%;}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .actions .btn{flex:1;min-width:110px;}

  .quiz-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;font-size:13px;color:#64748b;
  }
  .who{font-weight:800;color:#1e3a8a;}
  .progress{font-weight:600;color:#2563eb;background:#eff6ff;padding:3px 10px;border-radius:99px;font-size:12px;}

  .scene-row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;}
  .scene-box{
    flex:0 0 34%;min-width:150px;border-radius:14px;overflow:hidden;
    background:#eff6ff;border:1.5px solid #bfdbfe;
    display:flex;align-items:center;justify-content:center;padding:10px;
  }
  .scene-box svg{width:100%;height:auto;max-height:160px;}

  .prompt-box{flex:1;min-width:200px;}
  .q-index{
    display:inline-block;background:#2563eb;color:#fff;
    font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:8px;
  }
  .q-text{font-size:22px;font-weight:800;color:#1e3a8a;line-height:1.45;letter-spacing:.3px;}
  .q-cn{margin-top:5px;font-size:12.5px;color:#64748b;}
  .q-scene-name{margin-top:8px;font-size:12px;color:#3b82f6;font-weight:600;}

  .voice-bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .voice-bar .btn{flex:1;min-width:120px;}

  .rec-area{
    margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;
    border:1px dashed #cbd5e1;min-height:70px;
  }
  .rec-status{font-size:13px;color:#64748b;line-height:1.7;}
  .rec-status b{color:#2563eb;}
  .heard-text{
    margin-top:6px;font-size:15px;color:#1e3a8a;font-weight:600;
    min-height:22px;word-break:break-word;
  }
  .heard-text .placeholder{color:#cbd5e1;font-weight:400;}

  /* 录音回放 */
  #playbackBar{margin-top:10px;display:none;}
  #playbackBar audio{width:100%;height:38px;}

  /* 家长判定 */
  #manualBar{margin-top:12px;padding:12px;border-radius:12px;background:#fef9c3;border:1px solid #fde68a;display:none;}
  #manualBar .mtitle{font-size:13px;color:#92400e;font-weight:700;margin-bottom:8px;}
  #manualBar .mbtns{display:flex;gap:10px;flex-wrap:wrap;}
  #manualBar .mbtns .btn{flex:1;min-width:100px;}

  #qResult{margin-top:14px;padding:14px;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  #qResult.ok{background:#dcfce7;border:1px solid #86efac;}
  #qResult.bad{background:#fee2e2;border:1px solid #fca5a5;}
  #qResult.wait{background:#fef3c7;border:1px solid #fde68a;}
  .q-res-text{flex:1;min-width:160px;font-size:14px;line-height:1.8;}
  .q-res-text b{font-size:15px;}
  .ans-eng{font-family:Georgia,serif;font-weight:700;color:#1d4ed8;font-size:16px;}
  .sim-line{font-size:12px;color:#64748b;margin-top:2px;}

  .result-head{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;padding:8px 0;}
  .result-meta{font-size:14px;color:#475569;line-height:2.1;}
  .result-meta b{color:#1d4ed8;font-size:17px;font-weight:800;}
  .level-pill{display:inline-block;padding:2px 14px;border-radius:99px;font-size:13px;font-weight:800;background:#f1f5f9;color:#64748b;}
  .res-msg{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:#f8fafc;font-size:13.5px;color:#475569;text-align:center;border:1px dashed #cbd5e1;}

  .detail{margin-top:14px;font-size:13.5px;color:#334155;}
  .detail table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .detail th,.detail td{border:1px solid #e2e8f0;padding:6px 8px;text-align:left;}
  .detail th{background:#f1f5f9;color:#334155;font-weight:700;font-size:12px;}
  .detail td.c{text-align:center;}
  .ok-tag{color:#15803d;font-weight:800;}
  .bad-tag{color:#dc2626;font-weight:800;}

  .teacher p{margin:0 0 12px;font-size:13px;color:#64748b;}
  .teacher p b{color:#1d4ed8;font-size:15px;}

  .env-warn{
    background:#fef3c7;border:1px solid #fde68a;color:#92400e;
    border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;
    margin-bottom:12px;
  }
  .env-warn b{color:#b45309;}

  @media (max-width:560px){
    .scene-row{flex-direction:column;}
    .scene-box{flex:none;}
  }
</style>
</head>
<body>

<div id="errorBar"></div>
<div id="toast"></div>

<div class="app">

  <header class="hero">
    <h1>三年级英语 · 对话跟读检测</h1>
    <p>听音跟读 · 自动识别 · 共 9 题 · 每题 10 分</p>
  </header>

  <section class="card" id="setupPanel">
    <h2 class="card-title">开始检测</h2>
    <div class="field">
      <label for="inClass">班级</label>
      <input id="inClass" type="text" placeholder="例如：三年级(2)班" autocomplete="off">
    </div>
    <div class="field">
      <label for="inName">姓名</label>
      <input id="inName" type="text" placeholder="请输入孩子的姓名" autocomplete="off">
    </div>
    <button class="btn primary" id="btnStart">开始检测</button>
    <p class="hint">
      检测说明：页面出现一句课本对话和情境图片，点击 <b>🔊 听标准发音</b> 听一遍，
      然后点击 <b>🎤 按下录音</b> 让孩子跟着说一遍，说完点 <b>提交本题</b>。
      如浏览器不支持自动识别，可由家长听完后手动判定对错。共 9 题，满分 90 分。
    </p>
  </section>

  <section class="card" id="quizPanel" hidden>
    <div class="env-warn" id="envWarn" hidden></div>

    <div class="quiz-head">
      <span class="who" id="whoLabel"></span>
      <span class="progress" id="progressLabel">第 1 / 9 题</span>
    </div>

    <div class="scene-row">
      <div class="scene-box" id="sceneBox"></div>
      <div class="prompt-box">
        <span class="q-index" id="qIndex">第 1 题</span>
        <div class="q-text" id="qText"></div>
        <div class="q-cn" id="qCn"></div>
        <div class="q-scene-name" id="qSceneName"></div>
      </div>
    </div>

    <div class="voice-bar">
      <button class="btn ghost" id="btnSpeak">🔊 听标准发音</button>
      <button class="btn record" id="btnRecord">🎤 按下录音</button>
    </div>

    <div class="rec-area">
      <div class="rec-status" id="recStatus">点击“按下录音”，让孩子跟着说一遍。</div>
      <div class="heard-text" id="heardText"><span class="placeholder">识别结果会显示在这里…</span></div>
      <div id="playbackBar"><audio id="audioPlayback" controls></audio></div>
    </div>

    <div id="manualBar">
      <div class="mtitle">👨‍👩‍👧 家长/老师判定：孩子刚才读对了吗？</div>
      <div class="mbtns">
        <button class="btn success" id="btnManualOk">✅ 读对了</button>
        <button class="btn danger" id="btnManualBad">❌ 读错了</button>
      </div>
    </div>

    <div class="actions" id="qActions">
      <button class="btn primary" id="btnSubmitQ">提交本题</button>
    </div>

    <div id="qResult" hidden></div>

    <div class="actions" id="qNav" hidden>
      <button class="btn primary" id="btnNextQ">下一题 →</button>
    </div>
  </section>

  <section class="card" id="resultPanel" hidden>
    <h2 class="card-title">检测成绩</h2>
    <div class="result-head">
      <svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true">
        <circle cx="64" cy="64" r="52" fill="none" stroke="#e2e8f0" stroke-width="12"/>
        <circle id="ringArc" cx="64" cy="64" r="52" fill="none" stroke="#2563eb" stroke-width="12"
                stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
                transform="rotate(-90 64 64)"/>
        <text id="ringScore" x="64" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#1e3a8a">0</text>
        <text x="64" y="82" text-anchor="middle" font-size="12" fill="#94a3b8">分</text>
      </svg>
      <div class="result-meta">
        <div>答对 <b id="resCorrect">0</b> / 9 题</div>
        <div>正确率 <b id="resAcc">0%</b></div>
        <div>等级 <span class="level-pill" id="resLevel">—</span></div>
      </div>
    </div>
    <p class="res-msg" id="resMsg"></p>
    <div class="detail" id="resDetail"></div>
    <div class="actions">
      <button class="btn ghost" id="btnAgain">再测一次</button>
      <button class="btn primary" id="btnNextStudent">下一位孩子</button>
    </div>
  </section>

  <section class="card teacher">
    <h2 class="card-title">记录与导出</h2>
    <p>本机已记录 <b id="recCount">0</b> 名孩子的检测结果。</p>
    <div class="actions">
      <button class="btn primary" id="btnDownload">下载 对话检测结果.DOC</button>
      <button class="btn danger" id="btnClear">清空本机记录</button>
    </div>
  </section>

</div>

<script>
(function(){
'use strict';

/* ========== 全局错误提示 ========== */
window.onerror = function(msg, url, line){
  var bar = document.getElementById('errorBar');
  if(!bar) return;
  bar.style.display = 'block';
  bar.textContent = '⚠ 页面脚本出错：' + msg + '\n位置：第 ' + line + ' 行';
};

var toastTimer = null;
function toast(msg, warn){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = (warn ? 'warn' : '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = (warn ? 'warn' : ''); }, 2600);
}

/* ========== 环境能力检测 ========== */
var ENV = {
  tts: false,
  sr: false,
  recorder: false
};
(function detect(){
  try{
    if('speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'){
      ENV.tts = true;
    }
  }catch(e){}
  try{
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR) ENV.sr = true;
  }catch(e){}
  try{
    if(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      ENV.recorder = true;
    }
  }catch(e){}
})();

/* ========== 题库 ========== */
var QUESTIONS = [
  { key:'greet', text:'Hello! I’m Mike.', cn:'你好！我是迈克。',
    sceneName:'🏫 开学见面', svg:'school',
    accept:['hello','hi','i am mike','im mike','my name is mike','my names mike'] },
  { key:'name', text:'What’s your name?', cn:'你叫什么名字？',
    sceneName:'🙋 老师问名字', svg:'teacher',
    accept:['what is your name','whats your name','what is you name'] },
  { key:'meet', text:'Nice to meet you.', cn:'见到你很高兴。',
    sceneName:'🤝 初次见面', svg:'handshake',
    accept:['nice to meet you','nice to meet you too','nice meeting you'] },
  { key:'howareyou', text:'How are you?', cn:'你好吗？',
    sceneName:'☀️ 早晨问候', svg:'morning',
    accept:['how are you','how r u','how are you doing'] },
  { key:'colour', text:'What colour is it?', cn:'它是什么颜色？',
    sceneName:'🎨 美术课颜色', svg:'colour',
    accept:['what color is it','what colour is it','what color','what colour'] },
  { key:'animal', text:'What’s this?', cn:'这是什么？',
    sceneName:'🐶 动物园看动物', svg:'zoo',
    accept:['what is this','whats this','what is this'] },
  { key:'number', text:'How many plates?', cn:'有多少个盘子？',
    sceneName:'🍽️ 数盘子', svg:'plate',
    accept:['how many plates','how many plate'] },
  { key:'from', text:'Where are you from?', cn:'你来自哪里？',
    sceneName:'🌍 新同学介绍', svg:'world',
    accept:['where are you from','where you from','where are you from'] },
  { key:'like', text:'Do you like oranges?', cn:'你喜欢橙子吗？',
    sceneName:'🍊 水果店', svg:'fruit',
    accept:['do you like oranges','do you like orange','do you like oranges'] }
];

var TOTAL_Q = QUESTIONS.length;
var PER_SCORE = 10;
var STORE_KEY = 'eng_dialogue_quiz_records_v1';

/* ========== 状态 ========== */
var student = { name:'', className:'' };
var quizOrder = [];
var qIndex = 0;
var answers = {};
var submitted = false;

var recognition = null;
var mediaRecorder = null;
var mediaChunks = [];
var mediaStream = null;
var playbackUrl = null;
var isRecording = false;
var currentHeard = '';
var currentHeardFinal = '';
var manualChoice = null;   // 'ok' / 'bad' / null

/* ========== 工具 ========== */
function $(id){ return document.getElementById(id); }
function shuffle(a0){
  var a = a0.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* ========== SVG 情境图 ========== */
var SCENES = {
  school: '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="150" fill="#dbeafe" rx="8"/><rect x="30" y="70" width="140" height="70" fill="#fef3c7" rx="4"/><polygon points="30,70 100,30 170,70" fill="#f97316"/><rect x="85" y="100" width="30" height="40" fill="#92400e" rx="2"/><circle cx="115" cy="120" r="2" fill="#fbbf24"/><circle cx="60" cy="90" r="14" fill="#fde68a"/><circle cx="60" cy="86" r="6" fill="#1e3a8a"/><circle cx="140" cy="90" r="14" fill="#fde68a"/><circle cx="140" cy="86" r="6" fill="#b91c1c"/><text x="100" y="22" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="bold">Welcome!</text></svg>',
  teacher: '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="150" fill="#fef3c7" rx="8"/><circle cx="70" cy="55" r="22" fill="#fde68a"/><circle cx="70" cy="50" r="9" fill="#1e3a8a"/><rect x="55" y="78" width="30" height="42" fill="#3b82f6" rx="5"/><rect x="45" y="70" width="10" height="18" fill="#fbbf24" rx="3"/><circle cx="130" cy="72" r="16" fill="#fde68a"/><circle cx="130" cy="68" r="7" fill="#b91c1c"/><rect x="118" y="90" width="24" height="30" fill="#f97316" rx="5"/><text x="100" y="140" text-anchor="middle" font-size="10" fill="#1e3a8a" font-weight="bold">What’s your name?</text></svg>',
  handshake: '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="150" fill="#dcfce7" rx="8"/><circle cx="60" cy="55" r="18" fill="#fde68a"/><circle cx="60" cy="50" r="8" fill="#1e3a8a"/><rect x="46" y="74" width="28" height="36" fill="#3b82f6" rx="4"/><circle cx="140" cy="55" r="18" fill="#fde68a"/><circle cx="140" cy="50" r="8" fill="#b91c1c"/><rect x="126" y="74" width="28" height="36" fill="#f97316" rx="4"/><path d="M75 95 Q100 110 125 95" stroke="#92400e" stroke-width="6" fill="none" stroke-linecap="round"/><text x="100" y="138" text-anchor="middle" font-size="10" fill="#15803d" font-weight="bold">Nice to meet you!</text></svg>',

/* ========== 语音播放（TTS + Web Audio 兜底） ========== */
var audioCtx = null;
function playDing(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.value = 880;
    var t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    o.start(t0); o.stop(t0 + 0.52);
    // 第二声
    setTimeout(function(){
      try{
        var o2 = audioCtx.createOscillator();
        var g2 = audioCtx.createGain();
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.type = 'sine';
        o2.frequency.value = 1174;
        var t1 = audioCtx.currentTime;
        g2.gain.setValueAtTime(0.0001, t1);
        g2.gain.exponentialRampToValueAtTime(0.28, t1 + 0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.5);
        o2.start(t1); o2.stop(t1 + 0.52);
      }catch(e){}
    }, 220);
    return true;
  }catch(e){ return false; }
}

function speak(text){
  if(ENV.tts){
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.8;
      u.pitch = 1.05;
      var voices = window.speechSynthesis.getVoices();
      for(var i = 0; i < voices.length; i++){
        if(voices[i].lang && voices[i].lang.indexOf('en') === 0){
          u.voice = voices[i];
          break;
        }
      }
      // 用超时检测是否真正发声
      var started = false;
      u.onstart = function(){ started = true; };
      u.onerror = function(){ started = false; };
      window.speechSynthesis.speak(u);
      setTimeout(function(){
        if(!started){
          // TTS 没真正发声，用提示音兜底
          playDing();
          toast('当前浏览器朗读功能受限，请家长读给孩子听：' + text, true);
        }
      }, 700);
      return;
    }catch(e){}
  }
  // 完全无 TTS：提示音 + 文字提示
  playDing();
  toast('当前浏览器无法朗读，请家长照着屏幕读给孩子听', true);
}

/* ========== 录音：三档降级 ========== */
function initRecognition(){
  if(!ENV.sr) return;
  try{
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.maxAlternatives = 3;

    recognition.onstart = function(){
      isRecording = true;
      currentHeard = '';
      currentHeardFinal = '';
      setRecordBtn(true);
      $('recStatus').innerHTML = '<b>正在聆听…</b> 请大声跟读，说完点击停止。';
      $('heardText').innerHTML = '<span class="placeholder">识别中…</span>';
    };
    recognition.onresult = function(event){
      var interim = '', final = '';
      for(var i = event.resultIndex; i < event.results.length; i++){
        var t = event.results[i][0].transcript;
        if(event.results[i].isFinal) final += t;
        else interim += t;
      }
      if(interim) currentHeard = interim;
      if(final) currentHeardFinal += ' ' + final;
      var display = (currentHeardFinal + ' ' + currentHeard).trim();
      if(display) $('heardText').innerHTML = esc(display);
    };
    recognition.onerror = function(event){
      isRecording = false;
      setRecordBtn(false);
      if(event.error === 'not-allowed'){
        toast('麦克风权限未开启，请允许后重试', true);
        $('recStatus').innerHTML = '麦克风权限未开启。可改用家长手动判定。';
        showManualBar();
      }else if(event.error === 'no-speech'){
        toast('没有听到声音，请再试一次', true);
        $('recStatus').innerHTML = '没有听到声音，请靠近麦克风再试。';
      }else{
        $('recStatus').innerHTML = '识别出错：' + event.error + '，可改用家长手动判定。';
        showManualBar();
      }
    };
    recognition.onend = function(){
      isRecording = false;
      setRecordBtn(false);
      if(!submitted && !currentHeardFinal && !currentHeard){
        $('recStatus').innerHTML = '录音结束。如果识别不到，可由家长手动判定。';
      }else if(!submitted){
        $('recStatus').innerHTML = '<b>录音完成。</b>请点击“提交本题”。';
      }
    };
  }catch(e){
    recognition = null;
    ENV.sr = false;
  }
}

function startMediaRecording(){
  if(!ENV.recorder){
    toast('当前浏览器不支持录音，请家长直接判定', true);
    showManualBar();
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    mediaStream = stream;
    mediaChunks = [];
    var mime = '';
    var types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
    for(var i = 0; i < types.length; i++){
      if(window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(types[i])){
        mime = types[i]; break;
      }
    }
    try{
      mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    }catch(e){
      mediaRecorder = new MediaRecorder(stream);
    }
    mediaRecorder.ondataavailable = function(e){
      if(e.data && e.data.size > 0) mediaChunks.push(e.data);
    };
    mediaRecorder.onstop = function(){
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      if(mediaChunks.length){
        var blob = new Blob(mediaChunks, { type: mediaChunks[0].type || 'audio/webm' });
        if(playbackUrl) URL.revokeObjectURL(playbackUrl);
        playbackUrl = URL.createObjectURL(blob);
        $('audioPlayback').src = playbackUrl;
        $('playbackBar').style.display = 'block';
      }
      isRecording = false;
      setRecordBtn(false);
      $('recStatus').innerHTML = '<b>录音完成。</b>可以点上面的播放键回听，然后由家长判定对错。';
      showManualBar();
    };
    mediaRecorder.start();
    isRecording = true;
    setRecordBtn(true);
    $('recStatus').innerHTML = '<b>正在录音…</b> 让孩子大声跟读，说完点击停止。';
    $('heardText').innerHTML = '<span class="placeholder">当前浏览器不支持自动识别，请录音后由家长判定。</span>';
    $('playbackBar').style.display = 'none';
  }).catch(function(err){
    isRecording = false;
    setRecordBtn(false);
    toast('无法访问麦克风：' + (err && err.message || err), true);
    $('recStatus').innerHTML = '无法访问麦克风，请家长直接判定对错。';
    showManualBar();
  });
}

function stopMediaRecording(){
  try{ if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }catch(e){}
}

function setRecordBtn(recording){
  var b = $('btnRecord');
  if(recording){
    b.textContent = '⏹ 录音中… 点击停止';
    b.classList.add('recording');
  }else{
    b.textContent = '🎤 重新录音';
    b.classList.remove('recording');
  }
}

function onRecordClick(){
  if(submitted){ toast('本题已提交'); return; }
  if(isRecording){
    // 停止
    if(recognition && ENV.sr){ try{ recognition.stop(); }catch(e){} }
    else if(mediaRecorder){ stopMediaRecording(); }
    return;
  }
  // 开始
  if(ENV.sr && recognition){
    currentHeard = ''; currentHeardFinal = '';
    $('heardText').innerHTML = '<span class="placeholder">识别中…</span>';
    $('playbackBar').style.display = 'none';
    try{ recognition.start(); }
    catch(e){
      toast('语音识别启动失败，改用录音模式', true);
      startMediaRecording();
    }
  }else if(ENV.recorder){
    startMediaRecording();
  }else{
    toast('当前浏览器不支持录音，请家长直接判定', true);
    showManualBar();
  }
}

/* ========== 判分 ========== */
function normalize(s){
  return String(s || '').toLowerCase()
    .replace(/[’']/g, "'")
    .replace(/[^a-z0-9' ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function wordOverlap(a, b){
  var wa = normalize(a).split(' ').filter(Boolean);
  var wb = normalize(b).split(' ').filter(Boolean);
  if(!wa.length || !wb.length) return 0;
  var setB = {};
  wb.forEach(function(w){ setB[w] = (setB[w] || 0) + 1; });
  var hit = 0;
  wa.forEach(function(w){ if(setB[w]){ hit++; setB[w]--; } });
  return hit / Math.max(wa.length, wb.length);
}
function judgeAnswer(heard, q){
  var h = normalize(heard);
  if(!h) return { ok:false, sim:0 };
  var best = 0;
  q.accept.forEach(function(ans){
    var sim = wordOverlap(h, ans);
    if(h.indexOf(normalize(ans)) > -1) sim = Math.max(sim, 0.95);
    if(sim > best) best = sim;
  });
  return { ok: best >= 0.55, sim: best };
}

/* ========== 答题流程 ========== */
function applyEnvWarn(){
  var w = $('envWarn');
  var tips = [];
  if(!ENV.tts && !ENV.sr && !ENV.recorder){
    tips.push('<b>当前浏览器（如QQ浏览器、UC等）对语音功能支持较差。</b>本页面已自动切换为“家长判定”模式：句子会显示在屏幕上，请家长读给孩子听，孩子跟读后由家长点击“读对了/读错了”。建议改用 <b>电脑版 Chrome / Edge</b>，可获得自动朗读和语音识别。');
  }else{
    if(!ENV.tts) tips.push('朗读功能受限：请家长照着屏幕上的句子读给孩子听。');
    if(!ENV.sr && ENV.recorder) tips.push('自动识别不可用：将录制孩子的发音供回听，由家长判定对错。');
    if(!ENV.sr && !ENV.recorder) tips.push('录音不可用：请家长直接判定对错。');
  }
  if(tips.length){
    w.hidden = false;
    w.innerHTML = tips.join('<br>');
  }else{
    w.hidden = true;
  }
}

function startQuiz(){
  quizOrder = shuffle(QUESTIONS.map(function(_, i){ return i; }));
  qIndex = 0;
  answers = {};
  $('setupPanel').hidden = true;
  $('resultPanel').hidden = true;
  $('quizPanel').hidden = false;
  $('whoLabel').textContent = student.className + ' · ' + student.name;
  applyEnvWarn();
  initRecognition();
  loadQuestion(0);
  window.scrollTo({ top:0, behavior:'smooth' });
}

function loadQuestion(idx){
  qIndex = idx;
  submitted = false;
  manualChoice = null;
  currentHeard = '';
  currentHeardFinal = '';

  var q = QUESTIONS[quizOrder[idx]];
  $('qIndex').textContent = '第 ' + (idx + 1) + ' 题';
  $('progressLabel').textContent = '第 ' + (idx + 1) + ' / ' + TOTAL_Q + ' 题';
  $('qText').textContent = q.text;
  $('qCn').textContent = q.cn;
  $('qSceneName').textContent = q.sceneName;
  $('sceneBox').innerHTML = SCENES[q.svg] || SCENES.school;

  $('recStatus').innerHTML = '点击“听标准发音”听一遍，再点“按下录音”让孩子跟读。';
  $('heardText').innerHTML = '<span class="placeholder">识别结果会显示在这里…</span>';
  $('playbackBar').style.display = 'none';
  $('btnRecord').textContent = '🎤 按下录音';
  $('btnRecord').classList.remove('recording');
  isRecording = false;
  hideManualBar();
  $('qResult').hidden = true;
  $('qActions').hidden = false;
  $('qNav').hidden = true;
  $('btnSubmitQ').disabled = false;

  // 若浏览器不支持朗读/识别/录音，直接显示家长判定
  if(!ENV.sr && !ENV.recorder){
    showManualBar();
  }
}

function submitQuestion(){
  if(submitted) return;
  var q = QUESTIONS[quizOrder[qIndex]];
  var heard = (currentHeardFinal + ' ' + currentHeard).trim();

  // 如果有识别文本，自动判分
  if(heard){
    var res = judgeAnswer(heard, q);
    answers[q.key] = { ok: res.ok, heard: heard, sim: res.sim, text: q.text };
    submitted = true;
    $('qActions').hidden = true;
    hideManualBar();
    showQuestionResult(res.ok ? res : { ok:false, sim:res.sim, answer:q.text }, q, heard, false);
    return;
  }

  // 没有识别文本：走家长判定
  if(manualChoice === 'ok' || manualChoice === 'bad'){
    var ok = manualChoice === 'ok';
    answers[q.key] = { ok: ok, heard: '[家长判定]' + (ok ? '读对了' : '读错了'), sim: ok ? 1 : 0, text: q.text };
    submitted = true;
    $('qActions').hidden = true;
    hideManualBar();
    showQuestionResult({ ok: ok, sim: ok ? 1 : 0 }, q, '[家长判定]', true);
    return;
  }

  // 既没识别也没判定
  toast('请先录音，或请家长点击“读对了/读错了”判定', true);
  showManualBar();
}

function showQuestionResult(res, q, heard, isManual){
  var box = $('qResult');
  box.hidden = false;
  box.className = res.ok ? 'ok' : 'bad';

  var simPct = Math.round(res.sim * 100);
  var icon = res.ok
    ? '<svg width="42" height="42" viewBox="0 0 42 42"><circle cx="21" cy="21" r="20" fill="#16a34a"/><path d="M12 21.5l6 6 12-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg width="42" height="42" viewBox="0 0 42 42"><circle cx="21" cy="21" r="20" fill="#dc2626"/><path d="M14 14l14 14M28 14l-14 14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>';

  var html = '<div>' + icon + '</div>' +
    '<div class="q-res-text">' +
      '<b>' + (res.ok ? '正确！' : '不太对，再听一遍') + '</b><br>' +
      '标准句子：<span class="ans-eng">' + esc(q.text) + '</span><br>' +
      (isManual ? '判定方式：家长手动判定' : '你读的是：' + esc(heard)) +
      (isManual ? '' : '<br><span class="sim-line">匹配度：' + simPct + '%</span>') +
    '</div>';
  box.innerHTML = html;

  var nav = $('qNav');
  nav.hidden = false;
  var btn = $('btnNextQ');
  if(qIndex === TOTAL_Q - 1){
    btn.textContent = '完成作答，查看总成绩';
    btn.className = 'btn success';
  }else{
    btn.textContent = '下一题 →';
    btn.className = 'btn primary';
  }
}

function nextQuestion(){
  if(qIndex < TOTAL_Q - 1){
    loadQuestion(qIndex + 1);
    window.scrollTo({ top:0, behavior:'smooth' });
  }else{
    finalSubmit();
  }
}

/* ========== 总成绩 ========== */
function levelOf(score, full){
  var pct = full > 0 ? (score / full) * 100 : 0;
  if(pct >= 90) return { text:'优秀', color:'#15803d', bg:'#dcfce7', msg:'对话跟读非常棒，发音清晰、句子完整，继续保持！' };
  if(pct >= 80) return { text:'良好', color:'#1d4ed8', bg:'#dbeafe', msg:'掌握较好，个别句子还可以多听多读几遍。' };
  if(pct >= 70) return { text:'合格', color:'#b45309', bg:'#fef3c7', msg:'基本能跟读，建议每天听课本录音并大声模仿。' };
  if(pct >= 60) return { text:'待加强', color:'#c2410c', bg:'#ffedd5', msg:'部分句子还不够熟练，可以对照课本多练习几遍。' };
  return { text:'需努力', color:'#b91c1c', bg:'#fee2e2', msg:'跟读还不够流利，建议先听标准发音，再逐句跟读。' };
}

function finalSubmit(){
  var correct = 0;
  QUESTIONS.forEach(function(q){
    if(answers[q.key] && answers[q.key].ok) correct++;
  });
  var score = correct * PER_SCORE;
  var full = TOTAL_Q * PER_SCORE;
  var accuracy = Math.round(correct / TOTAL_Q * 100);
  var lv = levelOf(score, full);

  $('quizPanel').hidden = true;
  $('resultPanel').hidden = false;

  var CIRC = 2 * Math.PI * 52;
  var arc = $('ringArc');
  arc.setAttribute('stroke-dasharray', CIRC);
  arc.setAttribute('stroke-dashoffset', CIRC * (1 - score / full));
  arc.setAttribute('stroke', lv.color);
  $('ringScore').textContent = score;
  $('resCorrect').textContent = correct;
  $('resAcc').textContent = accuracy + '%';
  var pill = $('resLevel');
  pill.textContent = lv.text;
  pill.style.color = lv.color;
  pill.style.background = lv.bg;
  $('resMsg').textContent = lv.msg;

  var rows = '';
  QUESTIONS.forEach(function(q, i){
    var a = answers[q.key];
    var ok = a && a.ok;
    rows += '<tr>' +
      '<td class="c">' + (i + 1) + '</td>' +
      '<td>' + esc(q.text) + '</td>' +
      '<td class="c">' + esc(a ? a.heard : '（未作答）') + '</td>' +
      '<td class="c ' + (ok ? 'ok-tag' : 'bad-tag') + '">' + (ok ? '正确' : '错误') + '</td>' +
      '</tr>';
  });
  $('resDetail').innerHTML =
    '<table><thead><tr>' +
    '<th style="width:8%">序号</th><th>标准句子</th><th>识别/判定</th><th style="width:14%">判定</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';

  saveRecord({
    name: student.name,
    className: student.className,
    score: score,
    full: full,
    correct: correct,
    total: TOTAL_Q,
    accuracy: accuracy,
    level: lv.text,
    time: new Date().toLocaleString('zh-CN', { hour12:false }),
    details: QUESTIONS.map(function(q, i){
      var a = answers[q.key];
      return {
        no: i + 1,
        text: q.text,
        heard: a ? a.heard : '（未作答）',
        ok: !!(a && a.ok)
      };
    })
  });

  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ========== 存储 ========== */
function loadRecords(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveRecord(rec){
  var list = loadRecords();
  list.push(rec);
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
  catch(e){ toast('本机存储空间不足，本次记录未保存', true); }
  updateRecCount();
}
function updateRecCount(){
  var el = $('recCount');
  if(el) el.textContent = loadRecords().length;
}

/* ========== 下载 DOC ========== */
function downloadDoc(){
  var list = loadRecords();
  if(!list.length){ toast('本机还没有任何检测记录', true); return; }

  var n = list.length;
  var avgScore = (list.reduce(function(s, r){ return s + r.score; }, 0) / n).toFixed(1);
  var avgAcc   = (list.reduce(function(s, r){ return s + r.accuracy; }, 0) / n).toFixed(1);
  var excelCnt = list.filter(function(r){ return r.accuracy >= 90; }).length;
  var goodCnt  = list.filter(function(r){ return r.accuracy >= 80 && r.accuracy < 90; }).length;
  var passCnt  = list.filter(function(r){ return r.accuracy >= 60; }).length;

  var rows = list.map(function(r, i){
    var wrong = (r.details || []).filter(function(d){ return !d.ok; })
      .map(function(d){ return d.no + '.' + d.text + '（' + d.heard + '）'; })
      .join('；') || '无';
    return '<tr>' +
      '<td class="c">' + (i + 1) + '</td>' +
      '<td class="c">' + esc(r.name) + '</td>' +
      '<td class="c">' + esc(r.className) + '</td>' +
      '<td class="c">' + esc(r.time) + '</td>' +
      '<td class="c strong">' + r.score + '/' + r.full + '</td>' +
      '<td class="c">' + r.accuracy + '%</td>' +
      '<td class="c">' + esc(r.level) + '</td>' +
      '<td class="wrong">' + esc(wrong) + '</td>' +
      '</tr>';
  }).join('');

  var docHtml = '<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
    'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><title>对话检测结果</title>' +
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
    '<style>' +
    '@page{size:A4 landscape;margin:1.2cm 1cm;}' +
    'body{font-family:"宋体",SimSun,serif;font-size:10.5pt;color:#000;line-height:1.55;}' +
    'h1{font-family:"黑体",SimHei;font-size:16pt;text-align:center;margin:0 0 8pt;letter-spacing:1pt;}' +
    '.meta{text-align:center;font-size:9.5pt;color:#444;margin-bottom:10pt;}' +
    '.summary{width:100%;margin:0 0 10pt;border-collapse:collapse;}' +
    '.summary td{border:none;padding:2pt 12pt 2pt 0;font-size:10pt;}' +
    'table.list{width:100%;border-collapse:collapse;table-layout:fixed;}' +
    'table.list th,table.list td{border:1px solid #333;padding:3.5pt 4pt;font-size:9pt;vertical-align:top;word-break:break-all;}' +
    'table.list th{background:#dbeafe;text-align:center;font-family:"黑体",SimHei;font-weight:bold;}' +
    'td.c{text-align:center;} td.strong{font-weight:bold;color:#1d4ed8;} td.wrong{font-size:8.5pt;color:#b91c1c;}' +
    '.foot{margin-top:14pt;font-size:10pt;} .foot td{border:none;padding-top:16pt;}' +
    '</style></head><body>' +
    '<h1>三年级英语 · 对话跟读检测结果统计</h1>' +
    '<div class="meta">导出时间：' + new Date().toLocaleString('zh-CN', { hour12:false }) + '</div>' +
    '<table class="summary"><tr>' +
      '<td>检测人数：<b>' + n + '</b> 人</td>' +
      '<td>平均得分：<b>' + avgScore + '</b> 分</td>' +
      '<td>平均正确率：<b>' + avgAcc + '%</b></td>' +
    '</tr><tr>' +
      '<td>优秀（≥90%）：<b>' + excelCnt + '</b> 人</td>' +
      '<td>良好（80—89%）：<b>' + goodCnt + '</b> 人</td>' +
      '<td>及格（≥60%）：<b>' + passCnt + '</b> 人</td>' +
    '</tr></table>' +
    '<table class="list"><thead><tr>' +
      '<th style="width:5%">序号</th><th style="width:8%">姓名</th>' +
      '<th style="width:11%">班级</th><th style="width:13%">检测时间</th>' +
      '<th style="width:8%">得分</th><th style="width:7%">正确率</th>' +
      '<th style="width:7%">等级</th><th>未通过句子</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<table class="foot"><tr>' +
      '<td>家长/教师签字：________________</td>' +
      '<td style="text-align:right">日期：________________</td>' +
    '</tr></table></body></html>';

  try{
    var blob = new Blob(['\ufeff' + docHtml], { type:'application/msword;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '对话检测结果.DOC';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('已开始下载 DOC 文件');
  }catch(e){
    toast('下载失败：' + e.message, true);
  }
}

/* ========== 事件绑定 ========== */
function bindAll(){
  var btnStart = $('btnStart');
  if(btnStart && !btnStart.dataset.bound){
    btnStart.dataset.bound = '1';
    btnStart.addEventListener('click', function(){
      var clsEl = $('inClass'), nameEl = $('inName');
      clsEl.classList.remove('err');
      nameEl.classList.remove('err');
      var cls = clsEl.value.trim();
      var name = nameEl.value.trim();
      if(!cls){ clsEl.classList.add('err'); toast('请先填写班级', true); clsEl.focus(); return; }
      if(!name){ nameEl.classList.add('err'); toast('请先填写姓名', true); nameEl.focus(); return; }
      student = { className: cls, name: name };
      var btn = this;
      btn.textContent = '正在加载…';
      btn.disabled = true;
      setTimeout(function(){
        try{ startQuiz(); }
        catch(e){
          var bar = $('errorBar');
          bar.style.display = 'block';
          bar.textContent = '⚠ 开始失败：' + e.message;
        }finally{
          btn.textContent = '开始检测';
          btn.disabled = false;
        }
      }, 60);
    });
  }

  $('btnSpeak').addEventListener('click', function(){
    var q = QUESTIONS[quizOrder[qIndex]];
    speak(q.text);
  });

  $('btnRecord').addEventListener('click', onRecordClick);

  $('btnManualOk').addEventListener('click', function(){
    if(submitted) return;
    manualChoice = 'ok';
    toast('已标记：读对了，请点击“提交本题”');
  });
  $('btnManualBad').addEventListener('click', function(){
    if(submitted) return;
    manualChoice = 'bad';
    toast('已标记：读错了，请点击“提交本题”');
  });

  $('btnSubmitQ').addEventListener('click', function(){
    if(submitted) return;
    submitQuestion();
  });

  $('btnNextQ').addEventListener('click', function(){ nextQuestion(); });

  $('btnAgain').addEventListener('click', function(){
    $('resultPanel').hidden = true;
    startQuiz();
  });
  $('btnNextStudent').addEventListener('click', function(){
    $('resultPanel').hidden = true;
    $('quizPanel').hidden = true;
    $('setupPanel').hidden = false;
    $('inName').value = '';
    $('inName').focus();
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  $('btnDownload').addEventListener('click', downloadDoc);

  var clearArmed = false;
  $('btnClear').addEventListener('click', function(){
    var n = loadRecords().length;
    if(n === 0){ toast('本机没有记录可清空'); return; }
    if(!clearArmed){
      clearArmed = true;
      this.textContent = '再次点击确认清空（' + n + ' 条）';
      toast('再次点击将删除全部 ' + n + ' 条记录', true);
      var self = this;
      setTimeout(function(){ clearArmed = false; self.textContent = '清空本机记录'; }, 4000);
      return;
    }
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    updateRecCount();
    clearArmed = false;
    this.textContent = '清空本机记录';
    toast('已清空本机记录');
  });
}

document.addEventListener('DOMContentLoaded', bindAll);
if(document.readyState !== 'loading') bindAll();

updateRecCount();
if('speechSynthesis' in window){ try{ window.speechSynthesis.getVoices(); }catch(e){} }

})();
</script>
</body>
</html>
