<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三年级英语 · 对话跟读检测</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#eef2f7;color:#1f2937;min-height:100vh;padding:14px 12px 48px;}
  .app{max-width:760px;margin:0 auto;}
  #toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);background:rgba(30,41,59,.95);color:#fff;font-size:14px;padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:88vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .hero{text-align:center;padding:18px 12px 20px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#3b82f6);margin-bottom:14px;}
  .hero h1{margin:0 0 6px;font-size:20px;letter-spacing:2px;}
  .hero p{margin:0;font-size:12px;color:#bfdbfe;}
  .card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(15,23,42,.07);}
  .card-title{font-size:15px;margin:0 0 14px;color:#1e3a8a;font-weight:800;display:flex;align-items:center;gap:8px;}
  .card-title::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(#2563eb,#60a5fa);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:#475569;margin-bottom:6px;font-weight:600;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none;background:#f8fafc;}
  .field input:focus{border-color:#2563eb;background:#fff;}
  .hint{margin:14px 0 0;font-size:12.5px;color:#64748b;line-height:1.85;background:#f8fafc;border-radius:10px;padding:10px 12px;border-left:3px solid #93c5fd;}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:.16s;}
  .btn:active{transform:scale(.985);}
  .btn.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;}
  .btn.ghost{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;}
  .btn.danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
  .btn.success{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;}
  .btn.record{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;}
  .btn.record.recording{animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5);}50%{box-shadow:0 0 0 12px rgba(220,38,38,0);}}
  #btnStart{width:100%;}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .actions .btn{flex:1;min-width:110px;}
  .scene-row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin-bottom:14px;}
  .scene-box{flex:0 0 34%;min-width:150px;border-radius:14px;background:#eff6ff;border:1.5px solid #bfdbfe;display:flex;align-items:center;justify-content:center;padding:10px;}
  .scene-box svg{width:100%;height:auto;max-height:160px;}
  .prompt-box{flex:1;min-width:200px;}
  .q-index{display:inline-block;background:#2563eb;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:8px;}
  .q-text{font-size:22px;font-weight:800;color:#1e3a8a;}
  .q-cn{margin-top:5px;font-size:12.5px;color:#64748b;}
  .voice-bar{display:flex;gap:10px;flex-wrap:wrap;}
  .voice-bar .btn{flex:1;min-width:120px;}
  .rec-area{margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;border:1px dashed #cbd5e1;}
  #playbackBar{margin-top:10px;display:none;}
  #playbackBar audio{width:100%;height:40px;}
  #manualBar{margin-top:12px;padding:12px;border-radius:12px;background:#fef9c3;border:1px solid #fde68a;display:none;}
  #manualBar .mbtns{display:flex;gap:10px;margin-top:8px;}
  .result-head{display:flex;align-items:center;justify-content:center;gap:26px;padding:8px 0;}
  .result-meta{font-size:14px;line-height:2.1;}
  .result-meta b{color:#1d4ed8;font-size:17px;}
  .level-pill{padding:2px 14px;border-radius:99px;font-size:13px;font-weight:800;background:#f1f5f9;}
  .detail table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;}
  .detail th,.detail td{border:1px solid #e2e8f0;padding:6px;text-align:center;}
  .detail th{background:#f1f5f9;}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app">
  <header class="hero">
    <h1>三年级英语 · 对话跟读检测</h1>
    <p>听音跟读 · 录音回放 · 家长判定</p>
  </header>

  <section class="card" id="setupPanel">
    <h2 class="card-title">开始检测</h2>
    <div class="field"><label>班级</label><input id="inClass" type="text" placeholder="例如：三年级(2)班"></div>
    <div class="field"><label>姓名</label><input id="inName" type="text" placeholder="请输入孩子的姓名"></div>
    <button class="btn primary" id="btnStart">开始检测</button>
    <p class="hint">说明：点击“听发音”让孩子听，然后点击“录音”跟读。读完停止录音，家长点击回放听一听，最后由家长判定对错。共 9 题。</p>
  </section>

  <section class="card" id="quizPanel" hidden>
    <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:13px;color:#64748b;">
      <span id="whoLabel" style="font-weight:800;color:#1e3a8a;"></span>
      <span id="progressLabel"></span>
    </div>

    <div class="scene-row">
      <div class="scene-box" id="sceneBox"></div>
      <div class="prompt-box">
        <span class="q-index" id="qIndex"></span>
        <div class="q-text" id="qText"></div>
        <div class="q-cn" id="qCn"></div>
      </div>
    </div>

    <div class="voice-bar">
      <button class="btn ghost" id="btnSpeak">🔊 听标准发音</button>
      <button class="btn record" id="btnRecord">🎤 按下录音</button>
    </div>

    <div class="rec-area">
      <div id="recStatus" style="font-size:13px;color:#64748b;">点击“按下录音”，让孩子大声跟读。</div>
      <div id="playbackBar"><audio id="audioPlayback" controls></audio></div>
    </div>

    <div id="manualBar">
      <div style="font-size:13px;color:#92400e;font-weight:700;">👨‍👩‍👧 家长请回放录音，判定对错：</div>
      <div class="mbtns">
        <button class="btn success" id="btnManualOk">✅ 读对了</button>
        <button class="btn danger" id="btnManualBad">❌ 读错了</button>
      </div>
    </div>

    <div class="actions" id="qActions">
      <button class="btn primary" id="btnSubmitQ">提交本题</button>
    </div>

    <div class="actions" id="qNav" hidden>
      <button class="btn primary" id="btnNextQ">下一题 →</button>
    </div>
  </section>

  <section class="card" id="resultPanel" hidden>
    <h2 class="card-title">检测成绩</h2>
    <div class="result-head">
      <div style="font-size:40px;color:#1d4ed8;font-weight:900;" id="ringScore">0</div>
      <div class="result-meta">
        <div>答对 <b id="resCorrect">0</b> / 9 题</div>
        <div>等级 <span class="level-pill" id="resLevel">—</span></div>
      </div>
    </div>
    <div class="detail" id="resDetail"></div>
    <div class="actions">
      <button class="btn ghost" id="btnAgain">再测一次</button>
      <button class="btn primary" id="btnNextStudent">下一位孩子</button>
    </div>
  </section>
</div>

<script>
const QUESTIONS = [
  { text:'Hello! I’m Mike.', cn:'你好！我是迈克。' },
  { text:'What’s your name?', cn:'你叫什么名字？' },
  { text:'Nice to meet you.', cn:'见到你很高兴。' },
  { text:'How are you?', cn:'你好吗？' },
  { text:'What colour is it?', cn:'它是什么颜色？' },
  { text:'What’s this?', cn:'这是什么？' },
  { text:'How many plates?', cn:'有多少个盘子？' },
  { text:'Where are you from?', cn:'你来自哪里？' },
  { text:'Do you like oranges?', cn:'你喜欢橙子吗？' }
];

let student = {};
let qIndex = 0;
let answers = [];
let isRecording = false;
let mediaRecorder, mediaChunks = [], mediaStream, playbackUrl;

function $(id){ return document.getElementById(id); }
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.className = 'show';
  setTimeout(() => t.className = '', 2500);
}

// 语音合成
function speak(text){
  if(!('speechSynthesis' in window)) return toast('设备不支持发音');
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.8;
  window.speechSynthesis.speak(u);
}

$('btnStart').onclick = () => {
  const cls = $('inClass').value.trim();
  const name = $('inName').value.trim();
  if(!cls || !name) return toast('请填写班级和姓名');
  student = { cls, name };
  answers = new Array(9).fill(null);
  qIndex = 0;
  $('setupPanel').hidden = true;
  $('resultPanel').hidden = true;
  $('quizPanel').hidden = false;
  $('whoLabel').textContent = `${cls} · ${name}`;
  loadQuestion();
};

function loadQuestion(){
  const q = QUESTIONS[qIndex];
  $('qIndex').textContent = `第 ${qIndex + 1} 题`;
  $('progressLabel').textContent = `${qIndex + 1} / 9`;
  $('qText').textContent = q.text;
  $('qCn').textContent = q.cn;
  $('sceneBox').innerHTML = `<div style="font-size:40px;">🏫</div>`; // 简化图片
  
  $('recStatus').textContent = '点击“听标准发音”听一遍，再录音。';
  $('playbackBar').style.display = 'none';
  $('manualBar').style.display = 'none';
  $('btnRecord').textContent = '🎤 按下录音';
  $('btnRecord').classList.remove('recording');
  $('qActions').hidden = false;
  $('qNav').hidden = true;
  isRecording = false;
  
  setTimeout(() => speak(q.text), 300);
}

$('btnSpeak').onclick = () => speak(QUESTIONS[qIndex].text);

// 录音功能
$('btnRecord').onclick = async () => {
  if(isRecording){
    mediaRecorder.stop();
    return;
  }
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(mediaStream);
    mediaChunks = [];
    mediaRecorder.ondataavailable = e => mediaChunks.push(e.data);
    
    mediaRecorder.onstop = () => {
      isRecording = false;
      $('btnRecord').textContent = '🎤 重新录音';
      $('btnRecord').classList.remove('recording');
      $('recStatus').textContent = '录音完成！请回放并判定。';
      const blob = new Blob(mediaChunks, { type: 'audio/webm' });
      if(playbackUrl) URL.revokeObjectURL(playbackUrl);
      playbackUrl = URL.createObjectURL(blob);
      $('audioPlayback').src = playbackUrl;
      $('playbackBar').style.display = 'block';
      $('manualBar').style.display = 'block'; // 显示家长判定按钮
      mediaStream.getTracks().forEach(t => t.stop());
    };
    
    mediaRecorder.start();
    isRecording = true;
    $('btnRecord').textContent = '⏹ 录音中… 点击停止';
    $('btnRecord').classList.add('recording');
    $('recStatus').textContent = '正在录音，让孩子大声跟读...';
    $('playbackBar').style.display = 'none';
    $('manualBar').style.display = 'none';
  } catch(err) {
    toast('无法访问麦克风，请检查权限');
  }
};

let manualChoice = null;
$('btnManualOk').onclick = () => { manualChoice = true; toast('已标记：读对了'); };
$('btnManualBad').onclick = () => { manualChoice = false; toast('已标记：读错了'); };

$('btnSubmitQ').onclick = () => {
  if(manualChoice === null) return toast('请家长先判定对错');
  answers[qIndex] = manualChoice;
  $('qActions').hidden = true;
  $('manualBar').style.display = 'none';
  $('qNav').hidden = false;
  $('btnNextQ').textContent = (qIndex === 8) ? '完成作答' : '下一题 →';
};

$('btnNextQ').onclick = () => {
  manualChoice = null;
  if(qIndex < 8){
    qIndex++;
    loadQuestion();
  } else {
    showResults();
  }
};

function showResults(){
  $('quizPanel').hidden = true;
  $('resultPanel').hidden = false;
  const correct = answers.filter(a => a === true).length;
  const score = correct * 10;
  
  $('ringScore').textContent = score;
  $('resCorrect').textContent = correct;
  
  let lv = { text:'优秀', color:'#15803d' };
  if(score < 90) lv = { text:'良好', color:'#1d4ed8' };
  if(score < 80) lv = { text:'合格', color:'#b45309' };
  if(score < 60) lv = { text:'需努力', color:'#b91c1c' };
  
  const lvEl = $('resLevel');
  lvEl.textContent = lv.text;
  lvEl.style.color = lv.color;
  lvEl.style.background = lv.color + '22';

  let rows = '';
  QUESTIONS.forEach((q, i) => {
    const ok = answers[i];
    rows += `<tr>
      <td>${i+1}</td>
      <td style="text-align:left;">${q.text}</td>
      <td style="color:${ok ? '#15803d' : '#dc2626'};font-weight:bold;">${ok ? '正确' : '错误'}</td>
    </tr>`;
  });
  $('resDetail').innerHTML = `<table><tr><th>序号</th><th>标准句子</th><th>判定</th></tr>${rows}</table>`;
}

$('btnAgain').onclick = () => {
  $('resultPanel').hidden = true;
  $('quizPanel').hidden = false;
  answers = new Array(9).fill(null);
  qIndex = 0;
  manualChoice = null;
  loadQuestion();
};
$('btnNextStudent').onclick = () => {
  $('resultPanel').hidden = true;
  $('setupPanel').hidden = false;
  $('inName').value = '';
};
</script>
</body>
</html>
